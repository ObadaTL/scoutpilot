# ScoutPilot search configuration
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (scoutpilot init) generates a basic version automatically.

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches & graduate/early-career tech roles
# Tier 2: Strong matches, broader engineering scope
# Tier 3: Wide net, funded training, emerging tech
queries:
  # Tier 1: Core target roles & graduate schemes
  - query: "software engineer"
    tier: 1
  - query: "backend engineer"
    tier: 1
  - query: "backend developer"
    tier: 1
  - query: "graduate software engineer"
    tier: 1
  - query: "technology graduate scheme"
    tier: 1
  - query: "junior software engineer"
    tier: 1
  - query: "junior backend developer"
    tier: 1
  - query: "python developer"
    tier: 1

  # Tier 2: Full stack, cloud, and engineering
  - query: "full stack developer"
    tier: 2
  - query: "full stack engineer"
    tier: 2
  - query: "python engineer"
    tier: 2
  - query: "early career software engineer"
    tier: 2
  - query: "associate software engineer"
    tier: 2
  - query: "DevOps engineer"
    tier: 2
  - query: "cloud engineer"
    tier: 2
  - query: "data engineer"
    tier: 2
  - query: "AI engineer"
    tier: 2

  # Tier 3: Wider net, funded programs & automation
  - query: "software developer"
    tier: 3
  - query: "developer"
    tier: 3
  - query: "systems engineer"
    tier: 3
  - query: "automation engineer"
    tier: 3
  - query: "solutions engineer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "skills bootcamp software"
    tier: 3
  - query: "funded training software"
    tier: 3

# Locations to search
locations:
  - location: "Belfast, UK"
    remote: false
    label: "Belfast"
  - location: "Northern Ireland"
    remote: false
    label: "Northern Ireland"
  - location: "Remote"
    remote: true
    label: "Remote"
  - location: "United Kingdom"
    remote: false
    label: "UK Wide"
  - location: "London, UK"
    remote: false
    label: "London"

# Location priority focus: allows prioritizing Northern Ireland & Remote first,
# then widening to relocation across the UK.
location_focus:
  enabled: true
  priority:
    - ["Belfast", "BT1", "BT2", "BT7", "BT9"]
    - ["Northern Ireland", "Antrim", "Down", "Derry", "Armagh", "Tyrone", "Fermanagh"]
    - ["Remote", "Work from home", "WFH", "Anywhere", "Distributed"]
    - ["United Kingdom", "UK", "London", "Manchester", "Edinburgh", "Bristol", "Cambridge", "Birmingham", "Leeds", "Glasgow"]

# Location filtering -- broad acceptance, letting scoring handle precision
location:
  accept_patterns:
    - "Belfast"
    - "Northern Ireland"
    - "Antrim"
    - "Down"
    - "UK"
    - "United Kingdom"
    - "Great Britain"
    - "England"
    - "Scotland"
    - "Wales"
    - "London"
    - "Manchester"
    - "Edinburgh"
    - "Bristol"
    - "Cambridge"
    - "Oxford"
    - "Birmingham"
    - "Leeds"
    - "Glasgow"
    - "Remote"
    - "Anywhere"
    - "Work from home"
    - "WFH"
    - "Worldwide"
    - "EMEA"
  reject_patterns:
    - "US only"
    - "USA only"
    - "Canada only"
    - "Australia only"
    - "India only"
    - "Philippines only"
    - "must be based in Germany only"

# Country for Indeed/LinkedIn/Google Jobs searches
country: "uk"
country_indeed: "uk"

# JobSpy source boards
boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours

# Negative keywords -- exclude extreme seniority or clearance roles only
# Notice: "intern", "graduate", "junior" are ALLOWED, not excluded.
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief executive"
  - "chief technology"
  - "chief financial"
  - "head of engineering"
  - "principal architect"
  - "staff architect"
  - "clearance required"
  - "TS/SCI"
  - "DV clearance"
