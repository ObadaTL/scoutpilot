# NI / UK graduate & early-career job boards not covered by JobSpy or the
# ATS harvesters. Each is a listing-page scraper (discovery/grad_boards.py)
# that pulls job links off search-result pages into pointer rows; the
# enrichment stage fills in the full description per URL.
#
# Enable/disable and tune per board here. Every base_url below returned a
# live 200 on 2026-09-02.

grad_boards:
  nijobs:
    enabled: true
    base_url: "https://www.nijobs.com"
    list_paths:
      - "/jobs/software"
      - "/jobs/it"
      - "/jobs/engineering"
      - "/jobs/graduate"
      - "/jobs/it?keywords=graduate"
      - "/jobs/it?keywords=machine+learning"
    location: "Northern Ireland"
    max_pages: 2

  gradireland:
    enabled: true
    base_url: "https://gradireland.com"
    list_paths:
      - "/s/jobs/all"
    location: "Ireland"
    max_pages: 3

  # ---- blocked: Cloudflare / JS-rendered, need a browser fetch ----
  # These have no server-rendered job links and 403 or return an empty
  # shell to a plain HTTP client. They need the Playwright path
  # (smartextract-style) which isn't wired here yet. Left as stubs so the
  # work is visible; flip enabled once a browser fetcher exists.
  gradcracker:
    enabled: false          # Cloudflare 403 to any scripted UA
    base_url: "https://www.gradcracker.com"
    list_paths:
      - "/search/computing-technology/engineering-graduate-jobs"
    location: "United Kingdom"
    max_pages: 2

  brightnetwork:
    enabled: false          # 403 to any scripted UA
    base_url: "https://www.brightnetwork.co.uk"
    list_paths:
      - "/graduate-jobs/technology/"
    location: "United Kingdom"
    max_pages: 2

  milkround:
    enabled: false          # 200 but job cards are client-rendered (no /job/ links in HTML)
    base_url: "https://www.milkround.com"
    list_paths:
      - "/jobs/software-engineering"
    location: "United Kingdom"
    max_pages: 2
