# Direct career site registry for ApplyPilot
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time
  - "jpmc.fa.oraclecloud.com"  # JPMorgan Chase Oracle Cloud recruiting — CAPTCHA-gated

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "Job Bank Canada": "https://www.jobbank.gc.ca"
  "CareerJet Canada": "https://www.careerjet.ca"
  "BuiltIn Remote": "https://builtin.com"
  "BuiltIn Belfast": "https://builtin.com"
  "Hacker News Jobs": "https://news.ycombinator.com/"
  "RemoteOK": null
  "WelcomeToTheJungle": null
  "Workopolis": "https://www.workopolis.com"
  "WeWorkRemotely": "https://weworkremotely.com"
  "Startup.jobs": "https://startup.jobs"
  "Nodesk": "https://nodesk.co"
  "Talent.com": "https://www.talent.com"
  "JustRemote": "https://justremote.co"
  "Arc.dev": "https://arc.dev"
  "Himalayas": "https://himalayas.app"
  "Techstars Jobs": "https://www.techstars.com"
  "Randstad Canada": "https://www.randstad.ca/jobs/search/"

sites:
  # ── Searchable sites (URL includes query + location params) ──────────
  # Canada-specific
  - name: "Eluta"
    url: "https://www.eluta.ca/search?q={query_encoded}&l={location_encoded}"
    type: search

  - name: "Talent.com"
    url: "https://www.talent.com/jobs?k={query_encoded}&l={location_encoded}"
    type: search

  - name: "Randstad Canada"
    url: "https://www.randstad.ca/jobs/?keywords={query_encoded}&location={location_encoded}"
    type: search

  - name: "CareerJet Canada"
    url: "https://www.careerjet.ca/search/jobs?s={query_encoded}&l={location_encoded}"
    type: search

  - name: "Job Bank Canada"
    url: "https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring={query_encoded}&locationstring={location_encoded}&fage=2&sort=D"
    type: search

  # General tech (with search)
  - name: "Dice"
    url: "https://www.dice.com/jobs?q={query_encoded}&location=Remote&pageSize=100"
    type: search

  - name: "SimplyHired"
    url: "https://www.simplyhired.com/search?q={query_encoded}&l={location_encoded}"
    type: search

  - name: "PowerToFly"
    url: "https://powertofly.com/jobs/?keywords={query_encoded}&remote=true"
    type: search

  - name: "Techstars Jobs"
    url: "https://jobs.techstars.com/jobs?keywords={query_encoded}"
    type: search

  - name: "Startup.jobs"
    url: "https://startup.jobs/?q={query_encoded}&remote=true"
    type: search

  - name: "WelcomeToTheJungle"
    url: "https://www.welcometothejungle.com/en/jobs?query={query_encoded}&refinementList%5Bremote%5D%5B%5D=fulltime"
    type: search

  # ── Static sites (no query params, scraped once) ─────────────────────
  # Remote-first boards
  - name: "RemoteOK"
    url: "https://remoteok.com/remote-dev-jobs"
    type: static

  - name: "WeWorkRemotely"
    url: "https://weworkremotely.com/categories/remote-programming-jobs"
    type: static

  - name: "Remotive"
    url: "https://remotive.com/remote-jobs/software-dev"
    type: static

  - name: "JustRemote"
    url: "https://justremote.co/remote-developer-jobs"
    type: static

  - name: "Himalayas"
    url: "https://himalayas.app/jobs/developer"
    type: static

  - name: "Working Nomads"
    url: "https://www.workingnomads.com/jobs?category=development"
    type: static

  - name: "Remote.co"
    url: "https://remote.co/remote-jobs/developer/"
    type: static

  - name: "Nodesk"
    url: "https://nodesk.co/remote-jobs/"
    type: static

  - name: "DynamiteJobs"
    url: "https://dynamitejobs.com/category/remote-development-jobs"
    type: static

  - name: "4DayWeek"
    url: "https://4dayweek.io/remote-jobs/software-engineer"
    type: static

  # General tech (no search param)
  - name: "Hacker News Jobs"
    url: "https://news.ycombinator.com/jobs"
    type: static

  - name: "BuiltIn Remote"
    url: "https://builtin.com/jobs/remote/dev-engineering"
    type: static

  - name: "Wellfound"
    url: "https://wellfound.com/role/l/software-engineer/canada"
    type: static

  - name: "Arc.dev"
    url: "https://arc.dev/remote-jobs/developer"
    type: static

  - name: "Jobgether"
    url: "https://jobgether.com/remote-jobs/software-engineer"
    type: static

  - name: "TopStartups"
    url: "https://topstartups.io/jobs/?job_location=Remote"
    type: static

  - name: "Jobspresso"
    url: "https://jobspresso.co/remote-work/remote-software-development/"
    type: static

  - name: "FlexJobs"
    url: "https://www.flexjobs.com/remote-jobs/computer-it"
    type: static

  - name: "Otta"
    url: "https://otta.com/jobs/all?title=software+engineer&remote=true"
    type: search

  # ── Northern Ireland — added for a focused NI/Belfast job search ─────
  # Both sites are NI-scoped by nature of their whole domain, so every job
  # discovered from them is already NI/Belfast (or a remote role an NI
  # employer posted) -- no extra location filtering needed at discovery
  # time. Belfast-vs-rest-of-NI-vs-remote priority is applied later, in the
  # tailor/apply selection queries (see database.load_location_focus /
  # loc_priority), not here.
  - name: "NIJobs"
    # Hyphenated path search, confirmed live: /jobs/software-engineer/in-belfast
    # returns Belfast results; the same path without "/in-belfast" covers
    # all of NI (the site's default scope). {query_slug} = lowercased,
    # hyphenated query (e.g. "Graduate Software Engineer" -> "graduate-software-engineer").
    url: "https://www.nijobs.com/jobs/{query_slug}"
    type: search

  - name: "NIJobFinder"
    # Best-effort: this domain blocked automated fetches from this
    # environment, so its query-search URL pattern couldn't be confirmed --
    # points at the homepage itself (user-confirmed to be listing-rich)
    # rather than a guessed /jobs path. Scraped once, unfiltered by
    # keyword -- the scoring stage still ranks/filters everything by fit.
    # Replace with a confirmed search URL if a better one turns up.
    url: "https://www.nijobfinder.co.uk/"
    type: static

  - name: "BuiltIn Belfast"
    # User-provided URL for BuiltIn's Belfast city subsite (same platform
    # as the existing "BuiltIn Remote" static entry above, which already
    # extracts cleanly from builtin.com's job pages).
    url: "https://builtinbelfast.uk/jobs"
    type: static
