[project]
name = "scoutpilot"
version = "0.3.0"
description = "Finds, scores and tailors early-career job applications; auto-applies only where it's cheap"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "cv", "early-careers", "graduate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
scoutpilot = "scoutpilot.cli:app"

[project.urls]
Homepage = "https://github.com/obada/scoutpilot"
Repository = "https://github.com/obada/scoutpilot"
Issues = "https://github.com/obada/scoutpilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoutpilot"]

[tool.hatch.build]
artifacts = ["src/scoutpilot/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120
